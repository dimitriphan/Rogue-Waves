# Builds the phone widget (StatusWidget/) and publishes the APK as the "status-widget" release.
# Google's SDK host is closed to the cloud threads, so this is where the app compiles and its tests run.
name: Status widget

on:
  push:
    paths:
      - "StatusWidget/**"
      - ".github/workflows/status-widget.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: status-widget
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Test and build
        run: gradle -p StatusWidget --no-daemon testDebugUnitTest assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: RogueWavesStatus-apk
          path: StatusWidget/app/build/outputs/apk/release/app-release.apk

      - name: Publish the APK as the status-widget release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp StatusWidget/app/build/outputs/apk/release/app-release.apk RogueWavesStatus.apk
          gh release delete status-widget --yes --cleanup-tag || true
          gh release create status-widget RogueWavesStatus.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title "Rogue Waves Status (build ${GITHUB_RUN_NUMBER})" \
            --notes "Built from ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}. On the phone: open this page, tap RogueWavesStatus.apk, install. StatusWidget/README.md has the rest."
