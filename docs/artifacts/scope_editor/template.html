<style>
/* Layout: a chart-table ledger. A Deep Swell mast, a file rail of the 17 scope files, and the open file drawn as
   sheets (cards) with slot rows; who made each sheet shows as a chip, Claude's ~defaults~ as tape marks. */
:root {
  --bg: #e5eeeb; --panel: #f7faf9; --band: #d6e4e0; --ink: #1b3041; --ink2: #4f6779; --line: #c2d3cf;
  --swell: #2e4a62; --onswell: #e9f1ee; --teal: #3f8f96; --tealink: #ffffff; --tape: #e3c565; --tapebg: #f6e8b8;
  --tapeink: #5d4708; --coral: #e2725b; --coralbg: #f9ddd5; --coralink: #7a2a1a; --pearl: #f4eef8;
  --sheen1: #c9e4f2; --sheen2: #f2d9e6; --focus: #3f8f96; --flash: #fff3c4;
  --f-display: "Pixelify Sans", "Trebuchet MS", system-ui, sans-serif;
  --f-label: "Silkscreen", "Courier New", ui-monospace, monospace;
  --f-body: "Rubik", "Segoe UI", system-ui, sans-serif;
  --f-mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1b25; --panel: #162a38; --band: #122330; --ink: #e3edeb; --ink2: #9ab0ba; --line: #274050;
  --swell: #0a1620; --onswell: #cfe3e6; --teal: #5db0b6; --tealink: #08161e; --tape: #d6b955; --tapebg: #4a3f17;
  --tapeink: #f4e3a6; --coral: #e88a76; --coralbg: #4a2219; --coralink: #ffd2c6; --pearl: #2a2f3e;
  --sheen1: #3c5a6a; --sheen2: #5a3c50; --focus: #7cc8ce; --flash: #4a4320; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e1b25; --panel: #162a38; --band: #122330; --ink: #e3edeb; --ink2: #9ab0ba; --line: #274050;
  --swell: #0a1620; --onswell: #cfe3e6; --teal: #5db0b6; --tealink: #08161e; --tape: #d6b955; --tapebg: #4a3f17;
  --tapeink: #f4e3a6; --coral: #e88a76; --coralbg: #4a2219; --coralink: #ffd2c6; --pearl: #2a2f3e;
  --sheen1: #3c5a6a; --sheen2: #5a3c50; --focus: #7cc8ce; --flash: #4a4320; color-scheme: dark; }

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--f-body); font-size: 15px; line-height: 1.5; margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--swell); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.lab { font-family: var(--f-label); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink2); }
.num { font-variant-numeric: tabular-nums; }

/* mast */
.mast { background: var(--swell); color: var(--onswell); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
.mast-in { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand svg { flex: none; }
.brand b { font-family: var(--f-display); font-weight: 700; font-size: 21px; letter-spacing: .01em; white-space: nowrap; }
.brand small { font-family: var(--f-label); font-size: 10px; letter-spacing: .12em; opacity: .75; display: block; }
.save { font-size: 12.5px; opacity: .85; margin-left: auto; display: flex; align-items: center; gap: 6px; }
.save i { width: 8px; height: 8px; border-radius: 50%; background: var(--tape); display: inline-block; }
.save[data-s="ok"] i { background: #7bcf80; }
.save[data-s="err"] i { background: var(--coral); }
.search { flex: 1 1 220px; max-width: 360px; }
.search input { width: 100%; padding: 7px 10px; border-radius: 6px; border: 1px solid transparent; background: rgba(255,255,255,.12); color: var(--onswell); }
.search input::placeholder { color: var(--onswell); opacity: .65; }

/* frame */
.frame { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 22px; align-items: start; padding-block: 18px 60px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1320px; margin: 0 auto; }
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); max-height: calc(100vh - 96px); overflow: auto; display: grid; gap: 2px; }
.rail .lab { padding: 0 8px 6px; }
.rail a { display: grid; grid-template-columns: 26px minmax(0,1fr) auto; gap: 6px; align-items: center; padding: 6px 8px; border-radius: 6px; color: var(--ink); text-decoration: none; font-size: 14px; }
.rail a:hover { background: var(--band); }
.rail a[aria-current="page"] { background: var(--panel); box-shadow: inset 3px 0 0 var(--teal); font-weight: 500; }
.rail .no { font-family: var(--f-label); font-size: 11px; color: var(--ink2); }
.rail .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rail .bd { display: flex; gap: 4px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--teal); }
.cnt { font-family: var(--f-label); font-size: 10px; padding: 1px 5px; border-radius: 4px; }
.cnt.need { background: var(--coralbg); color: var(--coralink); }
.picker { display: none; }

/* main */
main { min-width: 0; }
.fhead { display: grid; gap: 10px; margin-bottom: 14px; }
.fhead h1 { font-family: var(--f-display); font-weight: 700; font-size: 30px; line-height: 1.1; margin: 0; text-wrap: balance; }
.fhead .file { font-family: var(--f-mono); font-size: 13px; color: var(--ink2); }
.stats { display: flex; flex-wrap: wrap; gap: 8px; }
.stat { display: inline-flex; align-items: baseline; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 3px 9px; font-size: 13px; }
.stat b { font-variant-numeric: tabular-nums; font-weight: 600; }
.tools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 5px 11px; font-size: 13.5px; }
.btn:hover { border-color: var(--teal); }
.btn.pri { background: var(--teal); color: var(--tealink); border-color: var(--teal); }
.btn.warn { border-color: var(--coral); color: var(--coralink); background: var(--coralbg); }
.btn[disabled] { opacity: .45; cursor: default; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: var(--panel); padding: 5px 11px; font-size: 13.5px; }
.seg button[aria-pressed="true"] { background: var(--swell); color: var(--onswell); }
.sp { flex: 1; }
.filters { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; background: var(--band); border-radius: 8px; padding: 8px 10px; }
.filters label { display: inline-flex; gap: 6px; align-items: center; font-size: 13.5px; }
.filters select { padding: 3px 6px; border-radius: 5px; border: 1px solid var(--line); background: var(--panel); }
.msg { border-radius: 8px; padding: 9px 12px; font-size: 14px; background: var(--panel); border: 1px solid var(--line); }
.msg.err { background: var(--coralbg); border-color: var(--coral); color: var(--coralink); }
.lint { display: grid; gap: 4px; }
.lint button { text-align: left; background: none; border: 0; padding: 2px 0; color: inherit; }
.lint button span { font-family: var(--f-mono); font-size: 12px; color: var(--ink2); margin-right: 8px; }

/* read view */
.doc { display: grid; gap: 4px; }
.r { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: start; border-radius: 5px; }
.r:hover { background: color-mix(in srgb, var(--band) 60%, transparent); }
.r.flash { background: var(--flash); transition: background 1.2s; }
.r .ed { opacity: 0; border: 0; background: none; padding: 1px 6px; color: var(--ink2); font-size: 13px; border-radius: 4px; }
.r:hover .ed, .r .ed:focus-visible { opacity: 1; }
@media (hover: none) { .r .ed { opacity: .55; } }
.kids { display: grid; gap: 3px; margin-left: 14px; }
.t-title { margin-top: 18px; }
.t-title > .r > .x { font-family: var(--f-display); font-size: 22px; font-weight: 700; }
.t-sec > .r > .x { font-family: var(--f-label); font-size: 13px; letter-spacing: .06em; color: var(--teal); padding-top: 10px; }
.t-group > .r > .x { font-family: var(--f-display); font-size: 18px; font-weight: 500; padding-top: 8px; border-bottom: 1px solid var(--line); }
.x { padding: 2px 4px; min-width: 0; overflow-wrap: anywhere; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px 10px; display: grid; gap: 4px; margin: 4px 0 6px; }
.card > .r .x.h { font-weight: 600; font-size: 16.5px; display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
.card .kids { margin-left: 0; }
.upg { border-left: 2px solid var(--line); padding-left: 8px; margin: 3px 0; }
.slot { display: grid; grid-template-columns: minmax(96px, 150px) minmax(0, 1fr); gap: 10px; }
.slot .k { color: var(--ink2); font-size: 13.5px; }
.design { color: var(--ink2); font-style: italic; }
.needs { background: var(--coralbg); color: var(--coralink); border-left: 3px solid var(--coral); font-weight: 500; }
.answer { background: var(--pearl); border-left: 3px solid var(--sheen1); }
.prose { max-width: 70ch; }
.note { font-size: 12.5px; color: var(--ink2); }
.note.c { color: var(--tapeink); background: color-mix(in srgb, var(--tapebg) 55%, transparent); border-radius: 3px; padding: 0 4px; }
.note.c::before { content: "Claude: "; font-family: var(--f-label); font-size: 10px; }
mark.cd { background: var(--tapebg); color: var(--tapeink); border-bottom: 1px dashed var(--tape); padding: 0 2px; border-radius: 2px; }
mark.cd.empty::after { content: "empty slot"; font-size: 11px; font-family: var(--f-label); }
.nm { font-weight: 500; }
.sys { color: var(--teal); font-weight: 500; }
a.ref { color: var(--teal); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
.chip { font-family: var(--f-label); font-size: 10px; letter-spacing: .06em; border-radius: 4px; padding: 2px 6px; font-weight: 400; white-space: nowrap; }
.chip.dim { background: var(--teal); color: var(--tealink); }
.chip.cla { background: var(--tape); color: #3b2e05; }
.chip.new { background: linear-gradient(90deg, var(--sheen1), var(--sheen2)); color: var(--ink); }
.chip.kind { background: var(--band); color: var(--ink2); }
.empty-f { color: var(--ink2); font-style: italic; padding: 6px 4px; }
.chip.st-draft { background: var(--band); color: var(--ink2); }
.chip.st-waiting { background: var(--tapebg); color: var(--tapeink); box-shadow: inset 0 0 0 1px var(--tape); }
.chip.st-pr { background: var(--sheen1); color: var(--ink); }
.chip.st-merged { background: var(--teal); color: var(--tealink); }
.dot.sent { background: var(--tape); }
.send { display: grid; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--tape); border-radius: 8px; padding: 10px 12px; }
.send.done { border-left-color: var(--teal); }
.send .row1 { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.send textarea { width: 100%; min-height: 2.4em; resize: vertical; border: 1px solid var(--line); border-radius: 5px; padding: 6px 8px; background: var(--bg); font-size: 14px; }
.send .why { font-size: 13px; color: var(--ink2); }

/* inline editor */
.editrow { display: grid; gap: 6px; background: var(--panel); border: 1px solid var(--teal); border-radius: 6px; padding: 8px; }
.editrow textarea { width: 100%; min-height: 2.6em; resize: vertical; font-family: var(--f-mono); font-size: 13.5px; border: 1px solid var(--line); border-radius: 5px; padding: 6px; background: var(--bg); }
.editrow .tools .hint { font-size: 12px; color: var(--ink2); }

/* text view */
.textv textarea { width: 100%; min-height: 70vh; font-family: var(--f-mono); font-size: 13.5px; line-height: 1.55; tab-size: 4; -moz-tab-size: 4; white-space: pre; overflow: auto;
  border: 1px solid var(--line); border-radius: 8px; padding: 12px; background: var(--panel); }

/* overview */
.ov { display: grid; gap: 18px; }
.ledger { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: grid; gap: 6px; }
.tile .big { font-family: var(--f-display); font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
.bar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--band); }
.bar span:nth-child(1) { background: var(--teal); }
.bar span:nth-child(2) { background: var(--tape); }
.tbl-wrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-family: var(--f-label); font-size: 10.5px; letter-spacing: .06em; color: var(--ink2); font-weight: 400; }
td.n { text-align: right; font-variant-numeric: tabular-nums; }
tr:last-child td { border-bottom: 0; }
td a { color: var(--ink); }
.legend { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; font-size: 13.5px; color: var(--ink2); }
.results { display: grid; gap: 12px; }
.results h3 { margin: 0 0 4px; font-size: 15px; }
.results button { display: block; width: 100%; text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; margin-top: 4px; font-size: 13.5px; }
.results button span { font-family: var(--f-mono); font-size: 12px; color: var(--ink2); margin-right: 8px; }

/* modal for export fallback */
.modal { position: fixed; inset: 0; background: rgba(10,22,32,.55); display: grid; place-items: center; z-index: 20; padding: 16px; }
.modal .box { background: var(--panel); border-radius: 10px; padding: 14px; width: min(760px, 100%); display: grid; gap: 10px; max-height: 90vh; }
.modal textarea { width: 100%; height: 50vh; font-family: var(--f-mono); font-size: 12.5px; tab-size: 4; white-space: pre; }

@media (max-width: 860px) {
  .frame { grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .rail { display: none; }
  .picker { display: block; }
  .picker select { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); }
  .slot { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .kids { margin-left: 8px; }
  .save { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) { .r.flash { transition: none; } }

<header class="mast">
  <div class="mast-in">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><path d="M3 26c4-1 6-5 7-9 2-7 7-11 14-11 4 0 7 2 7 5 0 2-2 3-4 3-2 0-3-1-3-3-3 0-6 2-7 6-2 6-1 10 4 12H3z" fill="#3f8f96"/><path d="M24 6c4 0 7 2 7 5 0 2-2 3-4 3" fill="none" stroke="#e9f1ee" stroke-width="2.2" stroke-linecap="round"/></svg>

<script>
const DATA = /*__DATA__*/null;
const FILES = DATA.files;               // [{key,name,title,text}]
const NEW = new Set(DATA.newNames);      // sheets added 2026-11-04
const LKEY = 'rw-scope-editor-v1';

/* ---------------------------------------------------------------- state */
const S = {};                            // key -> {base, text, hist:[], saved, at, by}
FILES.forEach(f => { S[f.key] = { base: f.text, text: f.text, hist: [], baseHash: hash(f.text), stale: false, status: null, pr: null, sentAt: null, note: '' }; });
const BUILT = DATA.built || '';            // the commit the page was built from
let cur = null, mode = 'read', filt = { by: 'all', grp: 'all', fresh: false }, editing = null, lintOpen = false, flashLine = -1;
let db = null, dl = null, store = 'none', notice = '', canWrite = true;

function hash(s) { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36) + ':' + s.length; }
const fileOf = k => FILES.find(f => f.key === k);
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const edited = k => S[k].text !== S[k].base;
const linesOf = t => t.replace(/\r?\n$/, '').split(/\r?\n/);
const joinLines = (ls, orig) => ls.join('\n') + (/\n$/.test(orig) ? '\n' : '');
const depth = raw => raw.length - raw.replace(/^\t+/, '').length;

/* ---------------------------------------------------------------- storage */
function setSave(s, text) { const el = document.getElementById('save'); el.dataset.s = s; el.querySelector('span').textContent = text; }
function loadLocal() {
  try { const o = JSON.parse(localStorage.getItem(LKEY) || '{}'); for (const k in o) if (S[k] && typeof o[k].text === 'string') applySaved(k, o[k]); } catch (e) {}
}
function applySaved(k, d) {
  S[k].text = d.text; S[k].at = d.at || null;
  S[k].stale = !!(d.baseHash && d.baseHash !== S[k].baseHash && d.text !== S[k].base);
  applyStatus(k, d);
}
function applyStatus(k, d) {   // what the project has done with this file's edit; a thread writes pr and merged
  S[k].status = d && d.status || null; S[k].pr = d && d.pr || null; S[k].sentAt = d && d.sentAt || null;
  S[k].note = d && typeof d.note === 'string' ? d.note : S[k].note;
}
const timers = {}, pending = new Set();
function queueSave(k) { pending.add(k); clearTimeout(timers[k]); setSave('wait', 'Saving…'); timers[k] = setTimeout(() => saveNow(k), 700); }
const writing = {};
async function saveNow(k) {
  const body = { text: S[k].text, baseHash: S[k].baseHash, at: new Date().toISOString(), file: fileOf(k).name, status: 'draft', note: S[k].note || '' };
  S[k].status = edited(k) ? 'draft' : null; S[k].pr = null; S[k].sentAt = null;
  if (db) {
    if (writing[k]) { writing[k].finally(() => saveNow(k)); return; }
    const ref = db.collection('scopes').doc('f' + k);
    writing[k] = (edited(k) ? ref.set(body) : ref.delete()).then(() => { setSave('ok', 'Saved to this page'); }, e => {
      if (e && e.code === 'invalid_argument') canWrite = false;   // below the viewer's level: read only for this visit
      setSave('err', 'Not saved: ' + (e && e.code === 'invalid_argument' ? 'you can read this page but not change it' : (e && e.message) || 'the page store refused it'));
      localSave(k, body);
    }).finally(() => { writing[k] = null; pending.delete(k); });
  } else { pending.delete(k); localSave(k, body); setSave(store === 'local' ? 'ok' : 'err', store === 'local' ? 'Saved in this browser only' : 'Not saved'); }
}
/* Send: marks the file's edit "waiting" for the project. A thread reads every waiting doc ("bring in my scope
   edits"), folds it into docs/scope through a reviewed PR, and writes back status "pr" (with pr) then "merged". */
async function sendFile(k) {
  if (!db || !edited(k)) return false;
  clearTimeout(timers[k]); pending.delete(k);
  while (writing[k]) await writing[k];
  const now = new Date().toISOString();
  const body = { text: S[k].text, baseHash: S[k].baseHash, at: S[k].at || now, file: fileOf(k).name, status: 'waiting', sentAt: now, note: S[k].note || '', builtFrom: BUILT };
  setSave('wait', 'Sending…');
  const w = db.collection('scopes').doc('f' + k).set(body).then(() => null, e => e || {});
  writing[k] = w;
  const e = await w;
  if (writing[k] === w) writing[k] = null;
  if (!e) { applyStatus(k, body); setSave('ok', 'Sent to the project'); return true; }
  if (e.code === 'invalid_argument') canWrite = false;
  notice = { t: 'Not sent: ' + (e.code === 'invalid_argument' ? 'you can read this page but not change it' : e.message || 'the page store refused it'), err: true };
  setSave('err', 'Not sent');
  return false;
}
const STATUS = {
  draft: ['Not sent', 'Saved here. Send it when it is ready for the project.'],
  waiting: ['Sent, waiting', 'Say “bring in my scope edits” in the project and a thread folds it into the scope through a pull request.'],
  pr: ['In a pull request', 'A thread has put it into a pull request; it shows here as merged once that merges.'],
  merged: ['Merged', 'It is in the scope now. The next rebuild of this page shows it as the published scope.'],
};
const unsent = k => edited(k) && (!S[k].status || S[k].status === 'draft');

/* ---------------------------------------------------------------- the scope format */
function tree(lines) {
  const root = { t: '', k: [], d: -1, i: -1 }; const st = [root];
  lines.forEach((raw, i) => {
    if (!raw.trim()) return;
    const n = { t: raw.trim(), k: [], d: depth(raw), i };
    while (st[st.length - 1].d >= n.d) st.pop();
    st[st.length - 1].k.push(n); st.push(n);
  });
  return root;
}
function splitNote(t) {
  if (!/\\\s*!?\s*$/.test(t)) return [t, null];
  const re = /(^|\s)\/(~?)(?=\s)/g; let m;
  while ((m = re.exec(t))) {
    const pre = t.slice(0, m.index);
    if (((pre.match(/~/g) || []).length) % 2 === 0)
      return [pre.trimEnd(), { c: m[2] === '~', t: t.slice(m.index + m[0].length).replace(/\\\s*!?\s*$/, '').trim() }];
  }
  return [t, null];
}
function inline(s) {
  let h = esc(s);
  h = h.replace(/~([^~]*)~/g, (_, v) => v ? '<mark class="cd" title="Claude’s default: delete both ~ to make it yours">' + v + '</mark>' : '<mark class="cd empty"></mark>');
  h = h.replace(/\{([^{}]*)\}/g, '<span class="nm">$1</span>');
  h = h.replace(/\[([^\[\]]+)\]/g, '<span class="sys">$1</span>');
  h = h.replace(/(\d\d)_([A-Za-z_]+)\.txt/g, (m, n) => fileOf(n) ? '<a class="ref" data-goto="' + n + '">' + m + '</a>' : m);
  h = h.replace(/-&gt;/g, '→');
  return h;
}
function noteHtml(n) { return n ? ' <span class="note' + (n.c ? ' c' : '') + '">' + inline(n.t) + '</span>' : ''; }
function kindOf(t, hasKids) {
  if (/^\|.*\|\s*$/.test(t)) return 'title';
  if (/^\[[^\]]+\]/.test(t)) return 'sec';
  if (/^\([^)]*\):\{/.test(t)) return 'card';
  if (/^\([^)]*\)/.test(t)) return 'group';
  if (/^\{/.test(t)) return hasKids ? 'card' : 'item';
  if (/^%/.test(t)) return 'upg';
  if (/^- [A-Za-z][A-Za-z0-9 '%\-]{0,38}: /.test(t) || /^- [A-Za-z][A-Za-z0-9 '%\-]{0,38}:$/.test(t)) return 'slot';
  if (/^- /.test(t)) return 'item';
  if (/^#/.test(t)) return 'design';
  if (/^\//.test(t)) return 'note';
  if (/^!/.test(t)) return 'needs';
  if (/^</.test(t)) return 'answer';
  return hasKids ? 'card' : 'prose';
}
function cardName(t) { const m = /\{([^{}]*)\}/.exec(t); return m ? m[1].replace(/~/g, '') : t.split(',')[0].trim(); }
function authorOf(n) {
  for (const k of n.k) { const m = /^- By:\s*(Dimitri|Claude)/.exec(k.t); if (m) return m[1]; }
  if (/^(\([^)]*\):)?\{~/.test(n.t)) return 'Claude';
  return null;
}
function hasBy(n) { return n.k.some(k => /^- By:/.test(k.t)); }

/* lint: the rules in 00_Read_Me.txt a slip can break */
function lint(lines) {
  const out = []; let prev = -1; const first = lines.findIndex(l => l.trim());
  if (first >= 0 && !/^\|.*\|\s*$/.test(lines[first].trim())) out.push({ i: first, m: 'The file should open with a | Title | line' });
  lines.forEach((raw, i) => {
    if (!raw.trim()) return;
    if (/^ +/.test(raw) || /^\t+ +\S/.test(raw)) out.push({ i, m: 'Indented with spaces: use one tab per level' });
    const d = depth(raw); if (prev >= 0 && d > prev + 1) out.push({ i, m: 'Jumps ' + (d - prev) + ' levels deeper than the line above' }); prev = d;
    const t = raw.trim(); const [b, n] = splitNote(t);
    if (!/^- (Rules|Symbols)|~value~|~like this~|ends? with|closing ~|a ~ on each side|written ~|empty ~~/.test(t) && ((b.match(/~/g) || []).length) % 2) out.push({ i, m: 'A ~default~ is missing its closing ~' });
    if ((b.match(/\{/g) || []).length !== (b.match(/\}/g) || []).length) out.push({ i, m: 'A {Name} is missing a brace' });
    if (/^%/.test(t) && !/^%\s?~?\d~?:\{/.test(t)) out.push({ i, m: 'An upgrade reads % 1:{Name} What it does' });
    if (/^</.test(t)) out.push({ i, m: 'An < answer > is waiting to be folded in' });
  });
  return out;
}

/* ---------------------------------------------------------------- import / export */
function titleOf(text) { const l = linesOf(text).find(x => x.trim()); return l ? l.trim() : ''; }
async function doImport(files) {
  const done = [], miss = [];
  for (const file of files) {
    const text = await file.text();
    const t = titleOf(text).replace(/\s+/g, ' ');
    const f = FILES.find(x => titleOf(x.text).replace(/\s+/g, ' ') === t) || FILES.find(x => x.name === file.name);
    if (!f) { miss.push(file.name); continue; }
    setText(f.key, text); done.push(f.name);
  }
  notice = { t: (done.length ? 'Imported ' + done.join(', ') + '. ' : '') + (miss.length ? 'Couldn’t tell which scope file ' + miss.join(', ') + (miss.length > 1 ? ' are' : ' is') + ': its first line should be a scope title such as | Directions |.' : ''), err: !!miss.length && !done.length };
  const one = done.length === 1 ? FILES.find(x => x.name === done[0]) : null;
  if (one && cur !== one.key) { const n = notice; go(one.key); notice = n; renderHead(); } else render();
}
async function exportFile(k) {
  const f = fileOf(k), text = S[k].text;
  if (dl) {
    try { const r = await dl.save({ filename: f.name, data: new Blob([text], { type: 'text/plain' }) }); notice = { t: r && r.status === 'delivered' ? f.name + ' sent.' : 'Saved ' + f.name + '.' }; render(); return true; }
    catch (e) { if (e && e.code === 'cancelled') return false; if (e && e.code !== 'unavailable') { notice = { t: 'Couldn’t save ' + f.name + ': ' + (e.message || e.code) + '. Copy it below instead.', err: true }; } }
  }
  showCopy(f.name, text); return true;
}
function showCopy(name, text) {
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = '<div class="box" role="dialog" aria-label="' + esc(name) + '"><b>' + esc(name) + '</b><span class="note">Saving files isn’t available here. Copy the text into a file with this name.</span><textarea readonly id="cpy"></textarea><div class="tools"><button class="btn pri" id="cpy-b">Copy</button><button class="btn" id="cpy-x">Close</button></div></div>';
  document.body.appendChild(m); const ta = m.querySelector('textarea'); ta.value = text;
  m.querySelector('#cpy-x').onclick = () => m.remove();
  m.querySelector('#cpy-b').onclick = e => { navigator.clipboard.writeText(text).then(() => { e.target.textContent = 'Copied'; }, () => { ta.select(); e.target.textContent = 'Press Ctrl+C'; }); };
}

/* ---------------------------------------------------------------- routing and events */
function go(k, line) { cur = k || null; editing = null; lintOpen = false; notice = ''; filt = { by: 'all', grp: 'all', fresh: false }; if (line != null) { flashLine = line; mode = 'read'; }
  const h = k ? '#f' + k : '#overview'; if (location.hash !== h) history.replaceState(null, '', h); document.getElementById('q').value = ''; render(); window.scrollTo(0, 0); }
function fromHash() { const m = /^#f(\d\d)$/.exec(location.hash); cur = m && fileOf(m[1]) ? m[1] : null; render(); }
window.addEventListener('hashchange', () => { editing = null; fromHash(); });
document.getElementById('pick').addEventListener('change', e => go(e.target.value || null));
document.getElementById('q').addEventListener('input', () => render());
document.getElementById('imp').addEventListener('change', e => { doImport([...e.target.files]); e.target.value = ''; });
let revArm = false;
document.addEventListener('click', e => {
  const t = e.target.closest('button, a.ref'); if (!t) return;
  if (t.matches('a.ref')) { e.preventDefault(); go(t.dataset.goto); return; }
  const id = t.id;
  if (t.dataset.go) { go(t.dataset.go, +t.dataset.line); return; }
  if (t.dataset.line != null && t.closest('.lint')) { mode = 'read'; flashLine = +t.dataset.line; renderBody(); return; }
  if (t.dataset.edit != null) { editing = { k: cur, i: +t.dataset.edit }; renderBody(); return; }
  if (t.dataset.act) {
    const row = t.closest('.editrow'), i = +row.dataset.i, val = row.querySelector('textarea').value;
    if (t.dataset.act === 'save') commitLine(i, val);
    else if (t.dataset.act === 'below') commitLine(i, val, 'below');
    else if (t.dataset.act === 'del') delLine(i);
    else { editing = null; renderBody(); }
    return;
  }
  if (id === 'm-read' || id === 'm-text') { mode = id === 'm-read' ? 'read' : 'text'; editing = null; render(); return; }
  if (id === 'undo') { const st = S[cur]; if (st.hist.length) { st.text = st.hist.pop(); queueSave(cur); editing = null; render(); } return; }
  if (id === 'check') { lintOpen = !lintOpen; renderHead(); return; }
  if (id === 'import') { document.getElementById('imp').click(); return; }
  if (id === 'export') { exportFile(cur); return; }
  if (id === 'send') { t.disabled = true; sendFile(cur).then(ok => { if (ok) notice = { t: fileOf(cur).name + ' is sent. Say “bring in my scope edits” in the project when you are done.' }; render(); }); return; }
  if (id === 'sendall') { t.disabled = true; (async () => { const done = []; for (const f of FILES) if (unsent(f.key)) { if (await sendFile(f.key)) done.push(f.name); else break; }
    if (done.length) notice = { t: 'Sent ' + done.join(', ') + '. Say “bring in my scope edits” in the project when you are done.' }; render(); })(); return; }
  if (id === 'exportall') { (async () => { for (const f of FILES) if (edited(f.key)) { const ok = await exportFile(f.key); if (!ok) break; } })(); return; }
  if (id === 'revert') {
    if (!revArm) { revArm = true; t.textContent = 'Click again to drop your edits to this file'; t.classList.add('warn'); setTimeout(() => { revArm = false; renderHead(); }, 4000); return; }
    revArm = false; setText(cur, S[cur].base); editing = null; render(); return;
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'f-by') { filt.by = e.target.value; renderBody(); }
  if (e.target.id === 'f-grp') { filt.grp = e.target.value; renderBody(); }
  if (e.target.id === 'f-new') { filt.fresh = e.target.checked; renderBody(); }
});
let txtT = null;
document.addEventListener('input', e => {
  if (e.target.id === 'sendnote') { S[cur].note = e.target.value; return; }
  if (e.target.id === 'txt') { const v = e.target.value; clearTimeout(txtT); txtT = setTimeout(() => { setText(cur, v); renderHead(); renderRail(); }, 500); }
});
document.addEventListener('keydown', e => {
  if (e.target.id === 'txt' && e.key === 'Tab') { e.preventDefault(); const ta = e.target, s = ta.selectionStart, en = ta.selectionEnd; ta.setRangeText('\t', s, en, 'end'); ta.dispatchEvent(new Event('input', { bubbles: true })); }
  if (e.target.closest && e.target.closest('.editrow')) {
    const row = e.target.closest('.editrow');
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); commitLine(+row.dataset.i, e.target.value); }
    if (e.key === 'Escape') { editing = null; renderBody(); }
  }
});

fromHash();
initStore();
</script>
